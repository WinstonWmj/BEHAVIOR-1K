defaults:
  - _self_  # all below configs will override this conf.yaml
  - robot: r1pro
  - task: behavior
  - policy: ???

# env_wrapper: 
#   _target_: omnigibson.learning.wrappers.RGBLowResWrapper
policy_name: ???  # filled by policy
headless: true  # whether to run in headless mode (no GUI)
eval_level: instance  # "instance" or "subtask"; explicitly selects which evaluation loop to run
eval_on_train_instances: false  # whether to eval on training instances
eval_instance_ids: null  # specific list of instance ids to eval in instance mode, if null test on all instances
write_video: true # whether we record videos during rollout
partial_scene_load: false  # whether to only load task-relevant rooms for a specific task
max_steps: null  # max steps per rollout episode, setting to null will use the default value (2 x average human demo completion steps)
waiting_for_stage_completion: true  # if env success fires before all sequential stages complete, keep the rollout alive until the stage chain catches up
keep_running_after_success: true  # if all stages are already complete, optionally continue the rollout after success until another stop condition ends it
log_path: ???
test_hidden: false  # [Internal use only] whether to eval on hidden test instances
policy_endpoints: {}  # switchable policy servers: {name: {host: str, port: int}}

# + additional config
env_wrapper: 
  _target_: behavior.learning.wrappers.RGBWrapper

save_rollout: false
perturb_pose: false
perturb_pose_seed: 42

# parallel evaluator
use_parallel_evaluator: false
parallel_evaluator_start_idx: 0
parallel_evaluator_end_idx: 10

# subtask evaluation from demo data
demo_data_dir: null  # path to 2025-challenge-demos root, used by subtask eval for orchestrators / annotations / parquet state
orchestrators_annotation_dir: null  # path to orchestrators annotation directory, used by subtask eval for orchestrators/task-0000/episode_00000010/
run_episode_idx: null  # full episode index to eval in subtask mode, e.g. 10; null = all episodes under the task orchestrator and parquet
run_episode_indices: null  # optional list of full episode indices for subtask mode, e.g. [10, 20, 30]
subtask_index: null  # optional starting subtask index to run within each selected episode, e.g. 1
subtask_end_index: null  # optional inclusive end index; with subtask_index=1 and subtask_end_index=2 we run subtasks 1 -> 2 sequentially
subtask_skill: null  # optional skill / stage selector, e.g. press_radio or "press"; all matching occurrences in each episode will be evaluated
subtask_max_steps_multiplier: 3  # max_steps = (end_frame - start_frame) * multiplier

# instance-level reward selection
instance_reward_mode: potential  # "potential", "task", or "combined"
task_specific_reward_kwargs: {}

# parquet demo expert policy support
demo_expert_data_dir: null  # path to 2025-challenge-demos root for parquet-backed demo replay
demo_expert_episode_index: null  # full episode index, e.g. 10 for task-0000/episode_00000010.parquet
demo_expert_require_train_instance_match: true  # ensure eval instance matches the training demo instance
